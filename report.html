function stampText(){
  if(!LIVE||!LIVE.generated) return "";
  var d=new Date(LIVE.generated), mins=Math.round((Date.now()-d.getTime())/60000);
  var ago=mins<1?"just now":mins<60?(mins+" min ago"):mins<1440?(Math.round(mins/60)+" h ago"):(Math.round(mins/1440)+" d ago");
  return "Last read "+d.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})+"<br>"+ago;
}
function paint(){
  fillMonths();
  document.getElementById("stamp").innerHTML=stampText();
  document.getElementById("selCompare").value=ui.compare;
  Array.prototype.forEach.call(document.querySelectorAll("#segScope button"),function(b){
    b.classList.toggle("on",b.getAttribute("data-v")===ui.scope);
  });
  Array.prototype.forEach.call(document.querySelectorAll("#segBasis button"),function(b){
    b.classList.toggle("on",b.getAttribute("data-v")===ui.basis);
  });
  // The choice only bites on the month still running.
  document.getElementById("segBasis").style.opacity=(ui.month===currentPeriod())?"1":".45";
  // A file counts as unread only when it yielded no month at all. A coach whose current
  // months are fine but whose oldest tabs use a layout the parser will not guess at is not
  // a problem to flag on a page someone else reads.
  var bad=(LIVE&&LIVE.files)?LIVE.files.filter(function(f){
    return f.errors&&f.errors.length&&!(f.months&&f.months.length);
  }):[];
  renderCoachPanel();
  renderCoverage();
  var gaps=0;
  ((LIVE&&LIVE.files)||[]).forEach(function(f){
    gaps+=((f.errors||[]).filter(function(e){ return /^\d{4}-\d{2}/.test(e); })).length;
  });
  var msg=[];
  if(bad.length) msg.push(bad.length+" sheet(s) could not be read: "+bad.map(function(f){return f.coach;}).join(", "));
  if(gaps) msg.push(gaps+" month(s) could not be read \u2014 see Coverage");
  var skippedCount=((LIVE&&LIVE.skipped)||[]).length;
  if(skippedCount) msg.push(skippedCount+" file(s) skipped on their name \u2014 see Coverage");
  document.getElementById("note").textContent=msg.join(" \u00b7 ");
  render();
}

/* ---------- loading and refresh ---------- */
function loadAll(pass){
  return loadEnc("history.enc.json",false)
    .then(function(env){ return decrypt(env,pass); })
    .then(function(h){
      HIST=h;
      return loadEnc("live.enc.json",true)
        .then(function(env){ return decrypt(env,pass); })
        .then(function(l){ LIVE=l; }, function(){ LIVE=null; })
        .then(build);
    });
}
// Shows progress on the button itself, so a slow read never looks like a dead click.
function busy(id,on,text){
  var b=document.getElementById(id); if(!b) return;
  if(on){ b.dataset.label=b.dataset.label||b.textContent; b.textContent=text; b.disabled=true; }
  else { b.textContent=b.dataset.label||b.textContent; b.disabled=false; }
}
// newerThan: after a forced refresh, the figures that come back must actually be newer than
// the ones on screen. Showing the previous read and calling it done is the bug this fixes, so
// where the file has not caught up yet the page waits for it rather than reporting success.
function reload(newerThan){
  busy("btnReload",true,"Reading…");
  setStat("status","Reading the latest figures…","");
  var waited=0;
  function attempt(){
    return loadEnc("live.enc.json",true)
      .then(function(env){ return decrypt(env,PASS); })
      .then(function(l){
        var gen=l.generated?new Date(l.generated).getTime():0;
        if(newerThan&&gen&&gen<=newerThan&&waited<180000){
          waited+=5000;
          setStat("status","Waiting for the new figures to publish… ("+Math.round(waited/1000)+"s)","");
          return new Promise(function(r){ setTimeout(r,5000); }).then(attempt);
        }
        LIVE=l; build(); paint();
        if(newerThan&&gen&&gen<=newerThan){
          setStat("status","The read finished but the published figures have not changed — try Reload in a minute.","err");
          return;
        }
        checkLastRun();
        setStat("status","Up to date — last read "+(LIVE.generated?new Date(LIVE.generated).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}):"unknown"),"ok");
      });
  }
  return attempt()
    .catch(function(e){ setStat("status","Could not read the latest figures: "+e.message,"err"); })
    .then(function(){ busy("btnReload",false); });
}
/* ---------- a failed read ----------
   When the scheduled read fails, the figures on screen stay as they were and only the "Last
   read" time gives it away. On opening, the newest finished read is checked: if it failed
   after these figures were written, the reason the job pinned to its run is shown above the
   figures. Public information on a public repository, so no token is needed to look. */
function apiHeaders(){ var c=cfg(); return (c&&c.pat)?ghHeaders(c.pat):{Accept:"application/vnd.github+json"}; }
function runReason(run){
  var h=apiHeaders();
  return getJson(run.jobs_url+"?t="+Date.now(),h).then(function(j){
    var job=(j.jobs||[])[0]; if(!job) return null;
    return getJson("https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/check-runs/"+job.id+"/annotations?t="+Date.now(),h)
      .then(function(a){
        var hit=(a||[]).filter(function(x){ return /read failed/i.test(x.title||""); })[0];
        return hit?hit.message:null;
      });
  }).catch(function(){ return null; });
}
// The reason comes from outside the page, so it is shown as text, never as markup.
function escapeHtml(t){ return String(t).replace(/[&<>"']/g,function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; }); }
function fmtWhen(d){ return new Date(d).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}); }
function showReadFail(run,reason){
  var el=document.getElementById("readFail"); if(!el) return;
  if(!run){ el.style.display="none"; el.innerHTML=""; return; }
  el.innerHTML='<span><b>The last read failed.</b> '+escapeHtml(reason||"The Actions tab on GitHub has the details.")+
    '<span class="when">Failed '+fmtWhen(run.updated_at)+(LIVE&&LIVE.generated?" \u00b7 the figures below are from "+fmtWhen(LIVE.generated):"")+"</span></span>";
  el.style.display="";
}
function checkLastRun(){
  getJson("https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/actions/workflows/"+GH_WORKFLOW+"/runs?per_page=1&status=completed&t="+Date.now(),apiHeaders())
    .then(function(j){
      var run=(j.workflow_runs||[])[0];
      var gen=(LIVE&&LIVE.generated)?new Date(LIVE.generated).getTime():0;
      if(!run||run.conclusion==="success"||new Date(run.updated_at).getTime()<=gen){ showReadFail(null); return; }
      return runReason(run).then(function(reason){ showReadFail(run,reason); });
    })
    .catch(function(){});
}
function ghHeaders(t){ return {Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",Authorization:"Bearer "+t}; }
function refreshNow(){
  var c=cfg();
  if(!c.pat){
    setStat("status","Refresh access isn’t set on this device — open Refresh access below and save a token. The scheduled read still runs every three hours.","err");
    var tp=document.getElementById("tokenPanel"); if(tp) tp.open=true;
    return;
  }
  busy("btnRefresh",true,"Reading…");
  var tries=0;
  // The figures on screen now. The reload at the end must come back newer than this.
  var prevGen=(LIVE&&LIVE.generated)?new Date(LIVE.generated).getTime():0;
  // Only runs this button started. The old code took the newest run created in the last
  // minute, so a scheduled read already in flight could be mistaken for this one and the
  // page would stop waiting too early.
  var runsUrl="https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/actions/workflows/"+GH_WORKFLOW+"/runs?per_page=1&event=workflow_dispatch";
  var beforeId=null;
  setStat("status","Asking for a fresh read of the folder…","");
  getJson(runsUrl+"&t="+Date.now(),ghHeaders(c.pat))
    .then(function(j){ var r=(j.workflow_runs||[])[0]; beforeId=r?r.id:null; })
    .catch(function(){})
    .then(function(){
      return fetch("https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/actions/workflows/"+GH_WORKFLOW+"/dispatches",
        {method:"POST",headers:ghHeaders(c.pat),body:JSON.stringify({ref:GH_BRANCH})});
    })
  .then(function(r){
    if(r.status===204) return;
    if(r.status===401||r.status===403) throw new Error("the saved token was refused");
    if(r.status===404) throw new Error("the repository or workflow wasn’t found");
    throw new Error("GitHub replied "+r.status);
  })
  .then(function(){
    return new Promise(function(res,rej){
      (function poll(){
        // A cold run installs the browser before it opens the folder, which alone takes about
        // six minutes, so five was never long enough. This waits 15 and says where to look.
        if(++tries>180) return rej(new Error("still running after 15 minutes — open the Actions tab to see where it has got to"));
        var secs=tries*5;
        setStat("status","Reading the coach sheets… ("+(secs<90?secs+"s":Math.floor(secs/60)+"m "+(secs%60)+"s")+")","");
        getJson(runsUrl+"&t="+Date.now(),ghHeaders(c.pat))
          .then(function(j){
            var run=(j.workflow_runs||[])[0];
            if(run&&run.id!==beforeId&&run.status==="completed"){
              if(run.conclusion!=="success") return runReason(run).then(function(reason){
                showReadFail(run,reason);
                rej(new Error(reason||("the read finished with “"+run.conclusion+"”")));
              });
              return res();
            }
            setTimeout(poll,5000);
          }).catch(function(){ setTimeout(poll,5000); });
      })();
    });
  })
  .then(function(){ return reload(prevGen); })
  .catch(function(e){ setStat("status","Refresh failed — "+e.message,"err"); })
  .then(function(){ busy("btnRefresh",false); });
}

/* ---------- gate ---------- */
function wireToken(){
  var input=document.getElementById("liveToken");
  function show(){
    var has=!!cfg().pat;
    document.getElementById("tokenSummary").textContent="Refresh access"+(has?" \u00b7 saved on this device":" \u00b7 not set");
    setStat("tokenStatus",has?"Refresh now will work on this device.":"Without a token, Refresh now cannot start a read. Reload still works.",has?"ok":"");
  }
  document.getElementById("btnSaveToken").addEventListener("click",function(){
    var v=(input.value||"").trim();
    if(!v){ setStat("tokenStatus","Paste the token first.","err"); return; }
    var c=cfg(); c.pat=v;
    try{ localStorage.setItem(CFG_KEY,JSON.stringify(c)); }catch(e){}
    input.value=""; show();
  });
  document.getElementById("btnClearToken").addEventListener("click",function(){
    var c=cfg(); delete c.pat;
    try{ localStorage.setItem(CFG_KEY,JSON.stringify(c)); }catch(e){}
    show();
  });
  show();
}
function unlock(){
  var gate=document.getElementById("gate"), form=document.getElementById("gateForm"),
      input=document.getElementById("gatePass"), rem=document.getElementById("gateRemember"),
      btn=document.getElementById("gateBtn");
  return new Promise(function(resolve){
    function attempt(pass,keep,fromStore){
      setStat("gateStatus","Decrypting…","");
      btn.disabled=true;
      loadAll(pass).then(function(){
        PASS=pass;
        if(keep){ try{ localStorage.setItem(PASS_KEY,pass); }catch(e){} }
        gate.style.display="none";
        document.body.classList.remove("locked");
        document.getElementById("app").style.display="";
        setStat("gateStatus","","");
        resolve();
        checkLastRun();
      }).catch(function(e){
        btn.disabled=false;
        if(fromStore){ try{ localStorage.removeItem(PASS_KEY); }catch(e2){} }
        var wrong=e&&(e.name==="OperationError"||/decrypt/i.test(e.message||""));
        setStat("gateStatus",wrong?"That passphrase doesn’t open the data.":("Could not load the data: "+e.message),"err");
      });
    }
    form.addEventListener("submit",function(ev){
      ev.preventDefault();
      var v=(input.value||"").trim();
      if(!v){ setStat("gateStatus","Enter the passphrase.","err"); return; }
      attempt(v,!!rem.checked,false);
    });
    var saved=null; try{ saved=localStorage.getItem(PASS_KEY); }catch(e){}
    if(saved) attempt(saved,true,true); else input.focus();
  });
}

unlock().then(function(){
  paint();
  document.getElementById("selMonth").addEventListener("change",function(e){ ui.month=e.target.value; fillMonths(); render(); });
  document.getElementById("selSpan").addEventListener("change",function(e){ ui.span=e.target.value; saveUi(); fillMonths(); render(); });
  document.getElementById("selFrom").addEventListener("change",function(e){ ui.from=e.target.value; saveUi(); render(); });
  document.getElementById("selCompare").addEventListener("change",function(e){ ui.compare=e.target.value; saveUi(); render(); });
  Array.prototype.forEach.call(document.querySelectorAll("#segScope button"),function(b){
    b.addEventListener("click",function(){
      ui.scope=b.getAttribute("data-v"); saveUi();
      Array.prototype.forEach.call(document.querySelectorAll("#segScope button"),function(o){ o.classList.toggle("on",o===b); });
      render();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("#segBasis button"),function(b){
    b.addEventListener("click",function(){
      ui.basis=b.getAttribute("data-v"); saveUi();
      Array.prototype.forEach.call(document.querySelectorAll("#segBasis button"),function(o){ o.classList.toggle("on",o===b); });
      paint();
    });
  });
  // Wrapped, not passed directly: as a listener the click Event would arrive as reload's
  // "newerThan" argument, and a plain Reload must not wait for anything.
  document.getElementById("btnReload").addEventListener("click",function(){ reload(); });
  document.getElementById("btnRefresh").addEventListener("click",refreshNow);
  wireToken();
  if(!LIVE) setStat("status","No live figures have been written yet — run the refresh job once.","err");
});
})();
</script>
<script>
// Check for a newer page on every load, and never let the browser serve a cached copy of
// the worker itself. When a new worker takes over, reload once so the page on screen is the
// new one - otherwise a phone keeps showing the version it first installed.
if("serviceWorker" in navigator) window.addEventListener("load",function(){
  navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(function(reg){
    reg.update();
    setInterval(function(){ reg.update(); }, 60*60*1000);
  }).catch(function(){});
  var reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(reloading) return; reloading=true; location.reload();
  });
});
</script>
