name: Refresh data

on:
  schedule:
    - cron: "20 */3 * * *"      # every 3 hours (UTC)
  workflow_dispatch:             # the Refresh button in the dashboard triggers this

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04      # pinned: the browser fallback needs a known OS
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Only the last-resort fetch uses this, but it has to be here before the job starts.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The runner image already carries the libraries Chromium needs. Installing them again
      # goes through apt, which has hung for ten minutes before now, so it is a separate,
      # time-boxed step that the run is allowed to continue without.
      - name: Browser system libraries
        run: sudo npx playwright install-deps chromium
        timeout-minutes: 4
        continue-on-error: true

      - name: Install the browser
        run: npx playwright install chromium
        timeout-minutes: 6

      - name: Pull coach sheets and encrypt
        env:
          SHARE_URL: ${{ secrets.SHARE_URL }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          HISTORY_JSON: ${{ secrets.HISTORY_JSON }}
          ASSESS_SHARE_URL: ${{ secrets.ASSESS_SHARE_URL }}
        run: node scripts/refresh.mjs

      - name: Save changes
        run: |
          git config user.name "iam-refresh-bot"
          git config user.email "iam-refresh-bot@users.noreply.github.com"
          git add live.enc.json
          [ -f history.enc.json ] && git add history.enc.json || true
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Data refresh"
            git pull --rebase
            git push
          fi
